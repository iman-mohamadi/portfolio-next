<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e9e8e4" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <title>Iman Mohammadi — Front-End Architect &amp; WebGL Specialist</title>
    <meta
      name="description"
      content="Front-end architect and WebGL specialist. Design systems, rendering pipelines, and interfaces engineered to hold their shape at scale."
    />
    <link rel="canonical" href="https://imanmohammadi.dev/" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Iman Mohammadi — Front-End Architect &amp; WebGL Specialist" />
    <meta
      property="og:description"
      content="Design systems, rendering pipelines, and interfaces engineered to hold their shape at scale."
    />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: preconnect early, then load without blocking first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Iman Mohammadi",
        "jobTitle": "Front-End Architect & WebGL Specialist",
        "description": "Design systems, rendering pipelines, and front-end architecture.",
        "knowsAbout": ["React", "Vue", "WebGL", "Three.js", "GLSL", "Design Systems"],
        "sameAs": [
          "https://github.com/iman-mohamadi",
          "https://www.linkedin.com/in/iman-mohammadiii/",
          "https://instagram.com/im_mhmdi"
        ]
      }
    </script>

    <script>
      // Single fixed theme: dark only. Runs before first paint so the light
      // tokens never flash.
      (function () {
        try {
          localStorage.removeItem('theme');
        } catch (e) {}
        document.documentElement.dataset.theme = 'dark';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', '#0d0d0d');
      })();
    </script>
  </head>
  <body class="bg-paper text-ink antialiased">
    <div id="root"></div>
    <noscript>
      <div style="padding: 4rem 1.5rem; font-family: system-ui, sans-serif; color: #0a0a0a">
        <h1>Iman Mohammadi — Front-End Architect &amp; WebGL Specialist</h1>
        <p>
          This portfolio is an interactive WebGL experience and needs JavaScript enabled.
          You can reach me directly at
          <a style="color: #ff5a1e" href="mailto:Im.EnzO.021@gmail.com">Im.EnzO.021@gmail.com</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
